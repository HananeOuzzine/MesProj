<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" onsubmit="calculer()">
        <label for="">entre un entier:</label>
        <input type="text" name="nb" id="nb">
        <input type="submit" name=""id="">value="calculer factorielle"

    </form>
    <div id="res"></div>
    <script>
        let divRes = document.getElementById("res");
        function calculer(){
            event.preventDefault();
             let nbre = parseInt(document.getElementById("nb").value);
            if (isNaN(nbre)){
                divRes.innerHTML = 'veuiller saisir un nombre positif';
                return;
            }
            if (nbre < 0);{
                divRes.innerHTML = 'impossible de calculer la factorielle un nombre negatiif';
            return;
            }
            const resultat = fact(nbre);
            divRes.innerHTML = 'factorielle de $(nbre) = $(resultat)';
        }
        function fact(n) {
            if (n === 0 || n === 1) {
                console.log(n);
                return 1;
            } else {
                 console.log(n);
                return n * fact(n - 1);
            }
        }
        console.log("fact(3)=", fact(3));
    </script>
</body>

</html>
